# SigmaRCON Configuration

server:
  port: 6031
  bind-address: "0.0.0.0"

security:
  # CHANGE THIS to a long random string before starting the server.
  # Every request must send it as: Authorization: Bearer <api-token>
  api-token: "CHANGE_ME_TO_A_LONG_RANDOM_STRING"
  # Optional — restrict CORS to your own site. Leave empty to allow any origin
  # (not recommended once api-token is set for real use).
  allowed-origins:
    - "https://yoursite.pages.dev"

files:
  root-directory: "."
  max-upload-size-mb: 50

console:
  stream-enabled: true

chunklag:
  check-interval-seconds: 10
  warning-threshold-mspt: 50

lastseen:
  save-interval-seconds: 60
